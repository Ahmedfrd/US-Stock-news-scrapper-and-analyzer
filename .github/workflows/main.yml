name: Market Digest (off-machine)

# Runs 07:00 Hong Kong time, Mon-Fri (23:00 UTC the previous day). The
# Portfolio Digest goes out every run; the Market Digest only on
# market_digest_day (config.yaml, default Thu UTC = Friday-morning HK, same
# day as the weekly sector deep-dive). Manual "Run workflow" runs always
# produce BOTH reports. GitHub cron is UTC. Nothing runs on your own computer.
on:
  schedule:
    - cron: "0 23 * * 0-4"
  workflow_dispatch: {}          # manual "Run workflow" button in the Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run digest
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FINNHUB_API_KEY:    ${{ secrets.FINNHUB_API_KEY }}
          ADANOS_API_KEY:     ${{ secrets.ADANOS_API_KEY }}
          SEC_USER_AGENT:     ${{ secrets.SEC_USER_AGENT }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # Makes the finished report downloadable from the run page — handy for
      # testing before (or instead of) email/Telegram delivery.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: digests/
          if-no-files-found: ignore
